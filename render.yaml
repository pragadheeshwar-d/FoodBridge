services:
  # ==========================================
  # 1. Flask REST API Backend Web Service
  # ==========================================
  - type: web
    name: foodbridge-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodbridge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@foodbridge.com
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: PYTHON_VERSION
        value: 3.11.9

  # ==========================================
  # 2. React + Vite Frontend (Static Site)
  # ==========================================
  - type: web
    name: foodbridge-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: foodbridge-api
          property: host

# ==========================================
# 3. Managed PostgreSQL Database
# ==========================================
databases:
  - name: foodbridge-db
    databaseName: foodbridge
    user: foodbridge_user
    plan: free
